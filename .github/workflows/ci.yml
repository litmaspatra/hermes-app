name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Web (typecheck, unit tests, build, browser e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tools/web-e2e/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Browser e2e against the mock Hermes
        working-directory: tools/web-e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          ./run.sh

  plugin:
    name: Plugin (canvas + media)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fastapi httpx
      - run: python3 tools/test_canvas.py
      - run: python3 tools/test_media.py
      - run: python3 tools/test_chat_search.py
      - run: python3 tools/test_checkpoints.py
      - run: python3 tools/test_battery.py
      - run: python3 tools/test_approval.py

  android:
    name: Android Java compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hermes-mobile
          key: android-all-16
      - run: tools/java-check.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Android SDK dependencies
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;35.0.0"
          echo "ANDROID_HOME=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}" >> "$GITHUB_ENV"
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Package signed test APK
        env:
          VERSION_NAME: 0.7.99-approval-test
          VERSION_CODE: '7099'
        run: bash -x android/build.sh
      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-mobile-approval-test-apk
          path: android/build/hermes-mobile.apk
          retention-days: 7
          if-no-files-found: error
